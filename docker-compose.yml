services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posymart
      POSTGRES_USER: ${POSTGRES_USER:-posymart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - posymart_database:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-posymart.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posymart} -d posymart"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-posymart}:${POSTGRES_PASSWORD:-local-development-only}@database:5432/posymart
      PGSSL: "false"
      SESSION_DAYS: 7
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-before-deployment}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4000}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-}
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  posymart_database:
